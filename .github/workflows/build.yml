name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  # Desktop unit tests for the BPM engine. Runs first and gates the firmware
  # builds — there's no point shipping binaries whose tempo maths is broken.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Unit tests
        run: pio test -e native

  firmware:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [oled, tft, pinscan]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build ${{ matrix.env }}
        run: pio run -e ${{ matrix.env }}

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: openBPM-${{ matrix.env }}
          path: .pio/build/${{ matrix.env }}/firmware.bin
          if-no-files-found: error

  # Posts the run result to the #openBPM Discord channel. Runs regardless of
  # whether the gate jobs pass so failures are visible too; skips quietly if
  # the secret isn't configured (e.g. on forks).
  notify-discord:
    if: always()
    needs: [test, firmware]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RESULT: ${{ contains(needs.*.result, 'failure') && '❌ failed' || '✅ passed' }}
          COMMIT_MSG: ${{ github.event.head_commit.message || github.event.pull_request.title }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL not set, skipping notification."
            exit 0
          fi
          content="CI $RESULT on \`${{ github.ref_name }}\` (${{ github.event_name }} by ${{ github.actor }}): ${COMMIT_MSG} — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          payload=$(jq -n --arg content "$content" '{content: $content}')
          curl -fsS -X POST -H "Content-Type: application/json" -d "$payload" "$DISCORD_WEBHOOK_URL"
